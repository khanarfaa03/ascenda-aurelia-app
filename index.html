<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2a0505">
<title>Ascenda Aurelia</title>
<link rel="manifest" href="manifest.json">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Jost:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#240404;--bg2:#3d0909;--card:#4a0d0d;--line:#7a5a2c;--gold:#d9b36c;--gold2:#f2dba6;--txt:#f6ead3;--mut:#cfb3a2;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;margin:0}
html{background:var(--bg)}
body{background:radial-gradient(120% 60% at 50% 0,var(--bg2),var(--bg));color:var(--txt);font:400 15px/1.5 Jost,system-ui,sans-serif;min-height:100vh;padding-bottom:84px}
h1,h2,h3{font-family:"Cormorant Garamond",Georgia,serif;font-weight:600;color:var(--gold2);line-height:1.15}
h1{font-size:30px}h2{font-size:24px;margin-bottom:8px}h3{font-size:20px}
.wrap{max-width:560px;margin:auto;padding:18px}
.card{background:linear-gradient(160deg,var(--card),#360808);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:14px}
.mut{color:var(--mut)}.c{text-align:center}
.logo{display:block;margin:6px auto 14px;width:150px;border-radius:12px}
.banner{width:100%;border-radius:12px;border:1px solid var(--line);margin-bottom:14px}
button,input{font:inherit}
.btn{background:linear-gradient(180deg,var(--gold2),var(--gold));color:#2a0505;border:0;border-radius:10px;padding:12px 16px;font-weight:500;width:100%;cursor:pointer;margin-top:10px}
.btn.ghost{background:none;color:var(--gold2);border:1px solid var(--gold)}
.btn:focus-visible,input:focus-visible,nav button:focus-visible{outline:2px solid var(--gold2);outline-offset:2px}
input{width:100%;background:#2e0606;border:1px solid var(--line);border-radius:10px;padding:12px;color:var(--txt);margin-top:10px}
.err{color:#ffb4a2;margin-top:8px;min-height:20px}
.sw{display:flex;gap:8px;margin-bottom:6px}.sw button{flex:1;padding:10px;border-radius:10px;border:1px solid var(--line);background:none;color:var(--mut);cursor:pointer}.sw .on{background:var(--gold);color:#2a0505}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px}
.tag{border:1px solid var(--gold);color:var(--gold2);border-radius:99px;padding:2px 10px;font-size:13px;white-space:nowrap}
ul{padding-left:18px;margin:8px 0}li{margin:4px 0}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:#1a0303;border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px))}
nav button{flex:1;background:none;border:0;color:var(--mut);padding:8px 2px;font-size:13px;cursor:pointer}nav .on{color:var(--gold2)}
.msgs{height:46vh;overflow-y:auto;display:flex;flex-direction:column;gap:8px;padding:4px 0}
.b{max-width:82%;padding:9px 12px;border-radius:12px;border:1px solid var(--line)}
.b.u{align-self:flex-end;background:var(--gold);color:#2a0505;border-color:var(--gold)}.b.e{align-self:flex-start;background:var(--card)}
.send{display:flex;gap:8px}.send input{margin:0}.send .btn{width:auto;margin:0}
.gold{border-color:var(--gold2);box-shadow:0 0 0 1px var(--gold) inset}
.price{font:600 34px "Cormorant Garamond",Georgia,serif;color:var(--gold2)}
.ov{position:fixed;inset:0;background:rgba(10,0,0,.82);display:flex;align-items:flex-end;justify-content:center;z-index:20}
.sheet{width:100%;max-width:560px;background:var(--bg2);border:1px solid var(--gold);border-radius:18px 18px 0 0;padding:18px;max-height:92vh;overflow-y:auto}
.qr{width:210px;max-width:60%;border-radius:10px;display:block;margin:10px auto;background:#fff}
a.btn{display:block;text-decoration:none;text-align:center}
@media(prefers-reduced-motion:no-preference){.card{transition:border-color .2s}}
</style></head><body>
<div id="app"><p style="padding:24px;color:#f2dba6">Loading Ascenda Aurelia... (build 3)</p></div>
<script>window.onerror=function(m,s,l){var e=document.getElementById("app");if(e)e.innerHTML='<pre style="color:#fff;padding:16px;white-space:pre-wrap">Error: '+m+' (line '+l+')</pre>'}</script>
<script>
const IMG_SQ="data:image/jpeg;base64,[STRIPPED]",IMG_WIDE="data:image/jpeg;base64,[STRIPPED]",IMG_QR="data:image/png;base64,[STRIPPED]";
const CUR="Rs.",GOLD=500,FREE_MSGS=5;
const EX={
 nutri:{ic:"🥗",svc:"Nutrition & Diet Consultancy",n:"Dr. Uzma Shaheen",r:"Nutritionist & Dietician",p:100,
  pts:["Personalised diet plans for your body and routine","Healthy weight, energy and metabolism goals","Meal planning for diabetes, thyroid, PCOS and more","Simple habits you can keep for life"],
  hi:"Assalamualaikum! I am Dr. Uzma Shaheen. Tell me your goal, age, weight and daily routine, and we will begin."},
 fin:{ic:"💰",svc:"Personal Budgeting & Financial Consultancy",n:"Ms. Arfaa Khan",r:"Financial Analyst & Advisor",p:150,
  pts:["Monthly budgets that actually work","Savings and emergency fund planning","Debt control and smart spending","Clear steps toward long-term goals"],
  hi:"Hello! I am Arfaa Khan. Share your monthly income, expenses and goals, and we will build your plan."}
};
let mem={};
const ld=(k,d)=>{try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return mem[k]!==undefined?mem[k]:d}};
const sv=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){mem[k]=v}};
const esc=s=>s.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
let pay=null,users=ld("aa_users",{}),me=ld("aa_me",null),tab="home",chat=null,mode="login",err="";
const U=()=>users[me];
const save=()=>{sv("aa_users",users);sv("aa_me",me)};
const goldOn=()=>U().gold>Date.now();
const C=k=>{const u=U();u.c=u.c||{};return u.c[k]=u.c[k]||{m:[],used:0,done:false,paid:false}};
const can=k=>goldOn()||C(k).paid||!C(k).done;

// TIDIO CONNECTION
let tidioReady = false;
let tidioQueue = [];

function onTidioReady() {
  tidioReady = true;
  const pending = tidioQueue.splice(0);
  pending.forEach(fn => fn(window.tidioChatApi));
}

function whenTidioReady(callback) {
  if (tidioReady && window.tidioChatApi) {
    callback(window.tidioChatApi);
  } else {
    tidioQueue.push(callback);
  }
}

// Open the real Tidio conversation for the selected service
function startTidioChat(serviceKey) {
  const expert = EX[serviceKey];
  if (!expert) return;

  whenTidioReady(api => {
    api.show();
    api.open();

    api.messageFromVisitor(
      `Hello! I would like to consult about ${expert.svc}. Please connect me with ${expert.n} (${expert.r}).`
    );
  });
}

function auth(){
 const su=mode==="signup";
 return `<div class="wrap"><img class="logo" src="${IMG_SQ}" alt="Ascenda Aurelia logo">
 <h1 class="c">Rise to gold</h1><p class="mut c" style="margin:6px 0 16px">Health is Wealth. Wealth is Health.</p>
 <div class="card"><div class="sw"><button data-a="mode" data-v="login" class="${su?"":"on"}">Log in</button><button data-a="mode" data-v="signup" class="${su?"on":""}">Sign up</button></div>
 ${su?'<input id="nm" placeholder="Full name" autocomplete="name">':""}
 <input id="em" type="email" placeholder="Email" autocomplete="email">
 <input id="pw" type="password" placeholder="Password (6+ characters)" autocomplete="${su?"new-password":"current-password"}">
 <div class="err" role="alert">${esc(err)}</div>
 <button class="btn" data-a="auth">${su?"Create account":"Log in"}</button></div></div>`;
}
function home(){
 const u=U();
 return `<div class="wrap"><img class="banner" src="${IMG_WIDE}" alt="Ascenda Aurelia, Rise to Gold">
 <h1>Welcome, ${esc(u.name.split(" ")[0])}</h1>
 <p class="mut" style="margin:6px 0 16px">Two golden assets: your health and your money. We guide both.</p>
 ${Object.keys(EX).map(k=>{const e=EX[k];return `<div class="card"><div class="row"><h3>${e.ic} ${e.svc}</h3></div>
 <p style="margin-top:6px"><b>${e.n}</b><br><span class="mut">${e.r}</span></p><ul>${e.pts.map(p=>`<li>${p}</li>`).join("")}</ul>
 <div class="row"><span class="tag">First chat free</span><span class="mut">then ${CUR} ${e.p}</span></div>
 <button class="btn" data-a="open" data-v="${k}">Start chat</button></div>`}).join("")}
 <div class="card gold"><h3>Aurelia Gold</h3><p class="mut" style="margin:4px 0">A free consultation in both services for a month.</p>
 <button class="btn ghost" data-a="tab" data-v="gold">See Aurelia Gold</button></div></div>`;
}
function chats(){
 if(!chat){return `<div class="wrap"><h2>Chat with an expert</h2>${Object.keys(EX).map(k=>{const e=EX[k],c=C(k);
 const st=goldOn()?"Free with Gold":c.paid?"Paid session":c.done?`${CUR} ${e.p} to continue`:"First chat free";
 return `<div class="card"><div class="row"><div><b>${e.n}</b><br><span class="mut">${e.r}</span></div><span class="tag">${st}</span></div>
 <button class="btn" data-a="open" data-v="${k}">${c.m.length?"Open chat":"Start chat"}</button></div>`}).join("")}</div>`}
 const e=EX[chat],c=C(chat),ok=can(chat);
 return `<div class="wrap"><div class="row"><h2>${e.n}</h2><button class="tag" style="background:none;cursor:pointer" data-a="back">Back</button></div>
 <p class="mut" style="margin-bottom:8px">${e.r}</p>
 <div class="msgs" id="ms"><div class="b e">${e.hi}</div>${c.m.map(m=>`<div class="b ${m.f}">${esc(m.t)}</div>`).join("")}</div>
 ${ok?`<div class="send"><input id="mi" placeholder="Type your message" aria-label="Message"><button class="btn" data-a="send">Send</button></div>
 <p class="mut" style="margin-top:8px;font-size:13px">${goldOn()?"Free consultation with Aurelia Gold.":c.paid?`Paid consultation active. <a href="#" data-a="end" style="color:var(--gold2)">End consultation</a>`:`Free chat: ${FREE_MSGS-c.used} messages left.`}</p>`
 :`<div class="card gold c"><h3>Your free chat has ended</h3><p class="mut" style="margin-top:4px">Continue with ${e.n} for ${CUR} ${e.p}, or get a free month of consultations with Aurelia Gold.</p>
 <button class="btn" data-a="pay">Pay ${CUR} ${e.p} and continue</button><button class="btn ghost" data-a="tab" data-v="gold">Get Aurelia Gold ${CUR} ${GOLD}</button></div>`}</div>`;
}
function goldTab(){
 const u=U(),on=goldOn();
 return `<div class="wrap"><div class="card gold c"><img class="logo" style="width:96px" src="${IMG_SQ}" alt="">
 <h1>Aurelia Gold</h1><div class="price">${CUR} ${GOLD}</div><p class="mut">for 30 days</p>
 <ul style="text-align:left"><li>Free consultation with Dr. Uzma Shaheen (nutrition)</li><li>Free consultation with Ms. Arfaa Khan (finance)</li><li>Both services, one month, one price</li></ul>
 ${on?`<p class="tag" style="display:inline-block;margin-top:8px">Active until ${new Date(u.gold).toLocaleDateString()}</p>`:`<button class="btn" data-a="buy">Buy subscription ${CUR} ${GOLD}</button>`}</div></div>`;
}
function acct(){
 const u=U();
 return `<div class="wrap"><h2>My account</h2><div class="card"><b>${esc(u.name)}</b><br><span class="mut">${esc(me)}</span>
 <p style="margin-top:10px">Aurelia Gold: ${goldOn()?"Active until "+new Date(u.gold).toLocaleDateString():"Not subscribed"}</p></div>
 <button class="btn ghost" data-a="out">Log out</button></div>`;
}
const UPI="9717992487@axl";
function payModal(){
 if(!pay)return"";
 return `<div class="ov"><div class="sheet c" role="dialog" aria-label="Pay with UPI"><h2>Pay ${CUR} ${pay.amt}</h2><p class="mut">${pay.label}</p>
 <img class="qr" src="${IMG_QR}" alt="UPI QR code for Ascenda Aurelia">
 <p>UPI ID: <b>${UPI}</b> <a href="#" data-a="copy" style="color:var(--gold2)">Copy</a></p>
 <a class="btn ghost" href="upi://pay?pa=${UPI}&pn=Ascenda%20Aurelia&am=${pay.amt}&cu=INR&tn=${encodeURIComponent(pay.label)}">Open UPI app</a>
 <p class="mut" style="margin-top:12px;font-size:13px">Scan the QR with any UPI app, pay ${CUR} ${pay.amt}, then enter the 12-digit transaction ID (UTR).</p>
 <input id="utr" inputmode="numeric" placeholder="12-digit transaction ID (UTR)" maxlength="12" aria-label="Transaction ID">
 <div class="err" id="pe" role="alert"></div>
 <button class="btn" data-a="paid">I have paid ${CUR} ${pay.amt}</button><button class="btn ghost" data-a="x2">Cancel</button></div></div>`;
}
function render(){
 const a=document.getElementById("app");
 if(!me||!users[me]){a.innerHTML=auth();return}
 const v={home,chat:chats,gold:goldTab,acct}[tab]();
 const T=[["home","Home"],["chat","Chat"],["gold","Gold"],["acct","Account"]];
 a.innerHTML=v+`<nav>${T.map(t=>`<button data-a="tab" data-v="${t[0]}" class="${tab===t[0]?"on":""}">${t[1]}</button>`).join("")}</nav>`+payModal();
 const m=document.getElementById("ms");if(m)m.scrollTop=m.scrollHeight;
}
function send(){
 const i=document.getElementById("mi"),t=i.value.trim();if(!t)return;
 const c=C(chat),k=chat;c.m.push({f:"u",t});
 if(!goldOn()&&!c.paid){c.used++;if(c.used>=FREE_MSGS)c.done=true}
 save();
 setTimeout(()=>{c.m.push({f:"e",t:`Thank you. ${EX[k].n} has received your message and will reply shortly.`});save();if(chat===k)render()},800);
 render();
}
document.addEventListener("click",ev=>{
 const el=ev.target.closest("[data-a]");if(!el)return;ev.preventDefault();
 const a=el.dataset.a,v=el.dataset.v;
 if(a==="mode"){mode=v;err="";render()}
 else if(a==="auth"){
  const em=document.getElementById("em").value.trim().toLowerCase(),pw=document.getElementById("pw").value;
  if(!/^\S+@\S+\.\S+$/.test(em)){err="Enter a valid email address.";return render()}
  if(pw.length<6){err="Password must be at least 6 characters.";return render()}
  if(mode==="signup"){
   const nm=document.getElementById("nm").value.trim();
   if(!nm){err="Enter your full name.";return render()}
   if(users[em]){err="This email already has an account. Log in instead.";return render()}
   users[em]={name:nm,pw:btoa(pw),gold:0,c:{}};
  }else if(!users[em]||users[em].pw!==btoa(pw)){err="Email or password is incorrect.";return render()}
  me=em;err="";tab="home";save();render();
 }
 else if(a==="tab"){tab=v;if(v!=="chat")chat=null;render();scrollTo(0,0); if(v==="chat"){ whenTidioReady(api=>{ api.show(); api.open(); }); }}
 else if(a==="open"){ startTidioChat(v); }
 else if(a==="back"){chat=null;render()}
 else if(a==="send")send();
 else if(a==="pay"){pay={kind:"chat",k:chat,amt:EX[chat].p,label:EX[chat].svc+" consultation"};render()}
 else if(a==="copy"){try{navigator.clipboard.writeText(UPI)}catch(e){}el.textContent="Copied"}
 else if(a==="x2"){pay=null;render()}
 else if(a==="paid"){
  const utr=document.getElementById("utr").value.trim();
  if(!/^\d{12}$/.test(utr)){document.getElementById("pe").textContent="Enter the 12-digit transaction ID from your UPI app.";return}
  const u=U();u.pays=u.pays||[];u.pays.push({utr,amt:pay.amt,what:pay.label,t:Date.now()});
  if(pay.kind==="gold")u.gold=Date.now()+30*864e5;else C(pay.k).paid=true;
  pay=null;save();render();
 }
 else if(a==="end"){C(chat).paid=false;C(chat).done=true;save();render()}
 else if(a==="buy"){pay={kind:"gold",amt:GOLD,label:"Aurelia Gold, 30 days"};render()}
 else if(a==="out"){me=null;chat=null;mode="login";save();render()}
});
document.addEventListener("keydown",e=>{if(e.key==="Enter"&&e.target.id==="mi")send()});
render();
</script>
<script>window.onTidioChatApiReady = onTidioReady;</script>
<script src="//code.tidio.co/7ip5dcwpsepzbgujgzqvzj6mkwhkrsvt.js" async></script>
<script>if("serviceWorker" in navigator)addEventListener("load",function(){navigator.serviceWorker.register("sw.js").catch(function(){})})</script></body></html>
